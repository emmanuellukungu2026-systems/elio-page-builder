<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-64.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Elio Pages, by Aethel Technologies: one free page for your business — your work, your story and how to reach you, on a link and an NFC card."
    />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070d1f" media="(prefers-color-scheme: dark)" />
    <title>Elio Pages — one clean page for your business | Aethel Technologies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme before first paint. Default is light mode; dark is
      // only restored if the visitor explicitly chose it.
      (function () {
        try {
          var t = localStorage.getItem("elio-theme");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
        try {
          var l = localStorage.getItem("elio-lang");
          if (l) document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
