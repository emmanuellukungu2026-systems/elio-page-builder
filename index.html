<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-64.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Elio Pages — premium portfolio pages for freelancers and small businesses. Browse the catalog, open a project, start a conversation."
    />
    <meta name="theme-color" content="#070A14" />
    <title>Elio Pages — Premium portfolios for businesses that mean business</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme/language before first paint to avoid flashes
      (function () {
        try {
          var t = localStorage.getItem("elio-theme");
          if (t === "light") document.documentElement.classList.remove("dark");
        } catch (e) {}
        try {
          var l = localStorage.getItem("elio-lang");
          if (l) document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
